%YAML 1.2
---
$id: http://devicetree.org/schemas/phy/allwinner,sun8i-t153-usb-phy.yaml#
$schema: http://devicetree.org/meta-schemas/core.yaml#

title: Allwinner T153 USB2 AW PHY host port

maintainers:
  - Chen-Yu Tsai <wens@csie.org>
  - Maxime Ripard <mripard@kernel.org>

properties:
  compatible:
    const: allwinner,sun8i-t153-usb-phy
  reg:
    items:
      - description: AW PHY application registers
      - description: USB2 subsystem digital application registers
      - description: Host port 1 bypass register
  reg-names:
    items:
      - const: phy
      - const: top
      - const: pmu1
  clocks:
    maxItems: 3
  clock-names:
    items:
      - const: bus
      - const: bus-cfg
      - const: ref
  resets:
    maxItems: 1
  "#phy-cells":
    const: 1
    description: Port index; the current implementation supports host port 1.

required:
  - compatible
  - reg
  - reg-names
  - clocks
  - clock-names
  - resets
  - "#phy-cells"

additionalProperties: false
